<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- 전체 배경 (잘려도 색이 보이게) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 안전 영역 (중앙 80%) 안에 콘텐츠 배치 -->
  <!-- 나무 잎 - 더 작게 -->
  <g transform="translate(256, 220)">
    <circle cx="0" cy="-50" r="65" fill="url(#leaf)" opacity="0.9"/>
    <circle cx="-55" cy="-15" r="58" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="55" cy="-15" r="58" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="0" cy="20" r="62" fill="url(#leaf)" opacity="0.95"/>
  </g>

  <!-- 나무 줄기 -->
  <rect x="244" y="290" width="24" height="60" rx="5" fill="#78350f" opacity="0.85"/>

  <!-- V 글자 -->
  <text x="256" y="240"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120"
        text-anchor="middle"
        fill="#fff"
        style="paint-order: stroke; stroke: rgba(15,23,42,0.35); stroke-width: 4;">V</text>
</svg>
