<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 배경 그라디언트 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="vtext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 둥근 사각형 배경 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- 나무 잎(상단) - 풍성하게 보이도록 여러 원 겹치기 -->
  <g transform="translate(256, 200)">
    <circle cx="0" cy="-60" r="80" fill="url(#leaf)" opacity="0.9"/>
    <circle cx="-65" cy="-20" r="70" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="65" cy="-20" r="70" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="0" cy="20" r="75" fill="url(#leaf)" opacity="0.95"/>
  </g>

  <!-- 나무 줄기 -->
  <rect x="240" y="290" width="32" height="100" rx="6" fill="#78350f" opacity="0.85"/>

  <!-- V 글자 (큰 강조) - 잎 위에 -->
  <text x="256" y="225"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="140"
        text-anchor="middle"
        fill="#fff"
        style="paint-order: stroke; stroke: rgba(15,23,42,0.35); stroke-width: 4;">V</text>

  <!-- VOCA TREE 텍스트 (하단) -->
  <text x="256" y="430"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="44"
        text-anchor="middle"
        fill="#fff"
        letter-spacing="2">VOCA</text>
  <text x="256" y="475"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="32"
        text-anchor="middle"
        fill="#34d399"
        letter-spacing="3">TREE</text>
</svg>
